# =============================================================================
# CrimeWatch - Phase 1 (S1 + S2) : Kafka + Producer + Spark Streaming
#
# Tout lancer :            docker compose up -d --build
# Voir les logs :          docker compose logs -f producer spark-streaming
# Tout arrêter :           docker compose down
#
# Interfaces web :
#   Kafka UI  -> http://localhost:8080   (voir les topics et les messages)
#   Spark UI  -> http://localhost:4040   (voir le job de streaming)
#
# Les phases suivantes ajouteront ici : Airflow, Postgres, MLflow, Streamlit...
# =============================================================================

services:

  # --- Kafka : la "boîte aux lettres" où passent tous les messages -----------
  # Mode KRaft = Kafka sans Zookeeper (plus simple, 1 seul conteneur).
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"   # accès depuis ton PC (VS Code) : localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 3 "portes" : une pour les conteneurs (29092), une pour ton PC (9092),
      # une interne pour le contrôleur (9093).
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # les topics sont créés par kafka-init
      KAFKA_LOG_RETENTION_HOURS: 168             # on garde les messages 7 jours
      # Identifiant du cluster : 22 caractères (format imposé par Kafka KRaft)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --- Crée les 3 topics une seule fois, puis s'arrête -------------------------
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in crimes.raw weather.raw crimes.alerts; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        echo "Topics disponibles :"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  # --- Interface web pour regarder Kafka ---------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: crimewatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # --- S1 : le producer Python -------------------------------------------------
  # PRODUCER_MODE (dans .env) : "api" = vraies APIs, "replay" = démo avec un fichier
  # - api    : tourne en boucle tout seul (un tour toutes les 5 min)
  # - replay : rejoue le fichier UNE fois puis s'arrête.
  #            Pour rejouer la démo : docker compose up -d producer
  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    container_name: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      MAX_RECORDS_PER_CITY: ${MAX_RECORDS_PER_CITY:-2000}
      LOOKBACK_DAYS: ${LOOKBACK_DAYS:-}
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    command: >
      python -m producer.main
      --mode ${PRODUCER_MODE:-api}
      --speed ${REPLAY_SPEED:-10}
    restart: on-failure

  # --- S2 : le job Spark Structured Streaming ----------------------------------
  spark-streaming:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: spark-streaming
    user: root
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "4040:4040"   # Spark UI
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LAKE_PATH: /app/data/lake
      SPARK_CHECKPOINT_PATH: /app/data/checkpoints/spark
      DBSCAN_EPS_KM: ${DBSCAN_EPS_KM:-0.5}
      DBSCAN_MIN_SAMPLES: ${DBSCAN_MIN_SAMPLES:-5}
      HOTSPOT_MAX_RADIUS_KM: ${HOTSPOT_MAX_RADIUS_KM:-1.0}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    working_dir: /app
    volumes:
      - ./:/app                  # le code + data/lake (Bronze) visibles sur ton PC
      - ivy-cache:/opt/ivy       # cache des jars téléchargés (connecteur Kafka)
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      --conf spark.jars.ivy=/opt/ivy
      --conf spark.sql.session.timeZone=UTC
      --conf spark.sql.shuffle.partitions=4
      streaming/crime_stream_job.py
    restart: unless-stopped

volumes:
  kafka-data:
  ivy-cache: